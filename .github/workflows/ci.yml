name: microservices-ci
on:
  push:
    paths:
      - 'api-gateway/**'
      - 'user-service/**'
      - 'order-service/**'
      - 'payment-service/**'
      - 'notification-service/**'
      - 'shared/**'
      - 'contracts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'api-gateway/**'
      - 'user-service/**'
      - 'order-service/**'
      - 'payment-service/**'
      - 'notification-service/**'
      - 'shared/**'
      - 'contracts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false
      - run: cd "${{ matrix.service }}" && npm install
      - run: cd "${{ matrix.service }}" && node -e "require('./src/server.js'); setTimeout(()=>process.exit(0),200)"
