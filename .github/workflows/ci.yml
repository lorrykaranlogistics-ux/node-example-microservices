name: microservices-ci
on:
  push:
    paths:
      - 'node-example-microservices/**'
  pull_request:
    paths:
      - 'node-example-microservices/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false
      - run: |
          if [ -d "sample-microservices-node/${{ matrix.service }}" ]; then
            BASE_DIR="sample-microservices-node"
          else
            BASE_DIR="."
          fi
          cd "$BASE_DIR/${{ matrix.service }}"
          npm install
      - run: |
          if [ -d "sample-microservices-node/${{ matrix.service }}" ]; then
            BASE_DIR="sample-microservices-node"
          else
            BASE_DIR="."
          fi
          cd "$BASE_DIR/${{ matrix.service }}"
          node -e "require('./src/server.js'); setTimeout(()=>process.exit(0),200)"
